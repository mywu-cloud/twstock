name: 每日更新大盤資料

on:
  schedule:
    # GitHub cron 為 UTC；台北 = UTC+8
    - cron: "37 13 * * 1-5"   # 21:37 台北（融資融券約 21:00 公布）
    - cron: "17 15 * * 1-5"   # 23:17 台北 補抓
    - cron: "23 1 * * 6"      # 週六 09:23 台北 加大回補歷史籌碼
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "以 FinMind 重建長期歷史（首次部署請勾選）"
        type: boolean
        default: false
      backfill:
        description: "本次最多往回補幾個交易日的籌碼"
        default: "400"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Update data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          BACKFILL=40; MAXMIN=40; EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BACKFILL="${{ inputs.backfill }}"; MAXMIN=320
            if [ "${{ inputs.bootstrap }}" = "true" ]; then EXTRA="--bootstrap"; fi
          elif [ "${{ github.event.schedule }}" = "23 1 * * 6" ]; then
            BACKFILL=1500; MAXMIN=300
          fi
          python scripts/update.py --backfill "$BACKFILL" --max-minutes "$MAXMIN" $EXTRA
      - name: Commit & push
        run: |
          git config user.name  "quantlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 大盤資料更新"
          git pull --rebase --autostash || true
          git push
